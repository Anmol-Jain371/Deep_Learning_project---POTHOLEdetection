# RoadVision AI - Road Hazard Tracking Configuration (Historical Control Baseline)
# Baseline ByteTrack configuration with appearance score fusion enabled (fuse_score: True).
# Preserved for ablation benchmarks and project audit trail.

tracker_type: bytetrack
track_high_thresh: 0.14 # Detection confidence to initiate/maintain tracking
track_low_thresh: 0.05  # Secondary association threshold for shadowed/distant hazards
new_track_thresh: 0.16  # Confidence required to register a brand-new physical pothole
track_buffer: 75        # Keep track alive across 75 frames (~2.5-3.0 seconds)
match_thresh: 0.55      # Cost threshold for Hungarian matching
fuse_score: True        # Cost fused with confidence: Cost = 1 - (IoU * Conf)
