# RoadVision AI - Road Hazard Tracking Configuration (Experiment #2B)
# Hypothesis: Disabling score fusion (fuse_score: false) decouples geometric IoU matching
# from confidence scores, preventing moderate-confidence detections (~0.51) from being
# penalized during Kalman association.
# All other parameters held identical to baseline control.

tracker_type: bytetrack
track_high_thresh: 0.14
track_low_thresh: 0.05
new_track_thresh: 0.16
track_buffer: 75
match_thresh: 0.55
fuse_score: False
